services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Server
  # Handles persistence for Keycloak and all POS microservice databases.
  # Databases initialized via ./deploy/docker/init-databases.sql on first startup.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pos_postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    networks:
      - pos-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Keycloak Identity Provider (OAuth 2.0 / OpenID Connect)
  # Manages cashier & staff authentication, roles (RBAC), and JWT issuance.
  # Configured in development mode (start-dev) with realm auto-import on startup.
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.2
    container_name: pos-keycloak
    command: start-dev --import-realm
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_HTTP_PORT}:8080"
      - "9000:9000" # Management port for Health checks and Metrics
    volumes:
      - ./deploy/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos-net
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:9000/health/ready || curl -f http://localhost:8080/health/ready || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 3. Redis In-Memory Store
  # Used for distributed caching, token revocation, and active shift state.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:latest
    container_name: pos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - pos_redis_data:/data
    networks:
      - pos-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 4. RabbitMQ Message Broker
  # Handles asynchronous Integration Events and MassTransit messaging.
  # Web Management UI available on port 15672.
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.3.5-management-alpine
    container_name: pos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672" # AMQP protocol for .NET MassTransit
      - "${RABBITMQ_MANAGEMENT_PORT}:15672" # Management Dashboard UI
    volumes:
      - pos_rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pos-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 5. LocalStack (AWS S3 Cloud Emulator)
  # Emulates AWS S3 for storing product images, logos, invoices, and reports.
  # ---------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:stable
    container_name: pos-localstack
    restart: unless-stopped
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "${LOCALSTACK_PORT}:4566" # LocalStack Gateway
    volumes:
      - pos_localstack_data:/var/lib/localstack
    networks:
      - pos-net

  # ---------------------------------------------------------------------------
  # 6. Jaeger (Distributed Tracing Backend & Web UI)
  # Receives OpenTelemetry OTLP traces across POS microservices.
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: pos-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT}:16686" # Jaeger Web UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
    networks:
      - pos-net

  # ---------------------------------------------------------------------------
  # 7. Prometheus (Metrics Server)
  # Scrapes and stores metrics from ASP.NET Core apps and infrastructure.
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: pos-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090" # Prometheus Web UI
    volumes:
      - ./deploy/docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - pos_prometheus_data:/prometheus
    networks:
      - pos-net

  # ---------------------------------------------------------------------------
  # 8. Adminer (Database Management Web UI)
  # Lightweight web-based database management interface for PostgreSQL.
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: pos-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos-net

  # ---------------------------------------------------------------------------
  # 9. Grafana k6 (Load & Performance Testing Runner)
  # Runs performance and load test scripts against Keycloak & Identity API.
  # Bound to the 'test' profile so it does not auto-run during standard boot.
  # Usage: docker compose --profile test run --rm k6 run /scripts/identity-load-test.js
  # ---------------------------------------------------------------------------
  k6:
    image: grafana/k6:latest
    container_name: pos-k6
    profiles:
      - test
      - loadtest
    environment:
      - KEYCLOAK_URL=http://keycloak:8080
      - REALM=supermarket
    volumes:
      - ./tests/load/k6:/scripts:ro
    networks:
      - pos-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      keycloak:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 10. Grafana (Observability Dashboard & Telemetry Visualization)
  # Visualizes Prometheus metrics and Jaeger distributed traces.
  # Web Dashboard available on port 3000.
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: pos-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - pos_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - pos-net

# =============================================================================
# Persistent Volumes Definition
# =============================================================================
volumes:
  pos_postgres_data:
    name: pos_postgres_data
  pos_redis_data:
    name: pos_redis_data
  pos_rabbitmq_data:
    name: pos_rabbitmq_data
  pos_localstack_data:
    name: pos_localstack_data
  pos_prometheus_data:
    name: pos_prometheus_data
  pos_grafana_data:
    name: pos_grafana_data

# =============================================================================
# Network Definition
# =============================================================================
networks:
  pos-net:
    name: pos_network
    driver: bridge
