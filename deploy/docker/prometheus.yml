# =============================================================================
# Prometheus Configuration for SuperMarket POS — Hawkeye Observability Stack
# =============================================================================
# Prometheus scrapes metrics from the OpenTelemetry Collector's Prometheus
# exporter (port 9464), which aggregates all metrics from .NET microservices.
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Self-monitoring: Prometheus scrapes its own internal metrics
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # OpenTelemetry Collector: Aggregated metrics from all .NET microservices
  # The Collector's Prometheus exporter exposes combined metrics on port 9464
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:9464"]
